app = "serviceready"
primary_region = "iad"

[env]
  DATABASE_PATH = "/data/serviceready.db"
  PUBLIC_BASE_URL = "https://serviceready.fly.dev"
  AI_GATEWAY = "paypal-hackathon"
  PORT = "8080"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"

[[mounts]]
  source = "serviceready_data"
  destination = "/data"
