# ServiceReady — PayPal AI Hackathon live demo (TanStack Start + Nitro)
services:
  - type: web
    name: serviceready
    runtime: node
    plan: starter
    region: singapore
    branch: master
    autoDeployTrigger: commit
    buildCommand: bun install --frozen-lockfile && bun run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /api/paypal/config
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NITRO_PRESET
        value: node-server
      - key: HOST
        value: "0.0.0.0"
      - key: VITE_USE_MOCKS
        value: "false"
      - key: PAYPAL_ENV
        value: sandbox
      - key: OPENAI_BASE_URL
        value: https://api.x.ai/v1
      - key: OPENAI_MODEL
        value: grok-4.20-0309-non-reasoning
      - key: PUBLIC_ORIGIN
        value: https://serviceready.onrender.com
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: XAI_API_KEY
        sync: false
